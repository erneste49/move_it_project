{% block maincontent%}

    <div class=" grid gap-6 lg:grid-cols-5">
        <div></div>
        <div class="mt-[50px] col-span-3">
            <form action="{{ url_for('admin.edit_driver', id=driver.id) }}" method="post" class="space-y-4 rounded-2xl border border-slate-200 bg-white p-6 shadow-sm lg:col-span-2 lg:self-start">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <h3 class="text-lg font-bold text-sky-950 text-center text-3xl"> Update Driver Information </h3>
                <div>
                    <label for="d_name" class="mb-1.5 block text-sm font-semibold text-slate-800">Full name</label>
                    <input type="text" name="fullname" value="{{driver.fullname}}" id="d_name" required class="block w-full rounded-lg border border-slate-300 bg-slate-50 p-3 text-sm focus:border-orange-500 focus:outline-none focus:ring-2 focus:ring-orange-200">
                </div>

                <div class="grid gap-4 sm:grid-cols-2">
                    <div>
                        <label for="state" class="mb-1.5 block text-sm font-semibold text-slate-800">State of Residence </label>
                        <select name="d_state_id"  id="state" class="block w-full rounded-lg border border-slate-300 bg-slate-50 p-3 text-sm focus:border-orange-500 focus:outline-none focus:ring-2 focus:ring-orange-200">
                            <option value="{{ driver.d_state_id}}"> {{driver.state.state_name }} </option>
                            {% for state in states %}
                            <option value="{{state.state_id}}" >{{ state.state_name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label for="lga" class="mb-1.5 block text-sm font-semibold text-slate-800">L.G.A of Residence </label>
                        <select name="d_lga_id" id="local_government" class="block w-full rounded-lg border border-slate-300 bg-slate-50 p-3 text-sm focus:border-orange-500 focus:outline-none focus:ring-2 focus:ring-orange-200">
                            <option value="{{ driver.d_lga_id}}"> {{driver.lga.lga_name }} </option>
                            {% for lga in lgas %}
                            <option value="{{lga.lga_id}}" >{{ lga.lga_name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div>
                    <label for="address" class="mb-1.5 block text-sm font-semibold text-slate-800">Address: Closest landmark </label>
                    <input type="text" name="address" value="{{driver.address }}" id="address" required class="block w-full rounded-lg border border-slate-300 bg-slate-50 p-3 text-sm focus:border-orange-500 focus:outline-none focus:ring-2 focus:ring-orange-200">
                </div>

                <div>
                    <label for="d_phone" class="mb-1.5 block text-sm font-semibold text-slate-800">Phone</label>
                    <input type="tel" name="phone" value="{{driver.phone }}" id="d_phone" required class="block w-full rounded-lg border border-slate-300 bg-slate-50 p-3 text-sm focus:border-orange-500 focus:outline-none focus:ring-2 focus:ring-orange-200">
                </div>
                <div>
                    <label for="d_email" class="mb-1.5 block text-sm font-semibold text-slate-800">Email</label>
                    <input type="tel" name="email" value="{{driver.email }}" id="d_email" required class="block w-full rounded-lg border border-slate-300 bg-slate-50 p-3 text-sm focus:border-orange-500 focus:outline-none focus:ring-2 focus:ring-orange-200">
                </div>
                <div>
                    <label for="d_vehicle" class="mb-1.5 block text-sm font-semibold text-slate-800">Status</label>
                    <select name="status" id="d_status" class="block w-full rounded-lg border border-slate-300 bg-slate-50 p-3 text-sm focus:border-orange-500 focus:outline-none focus:ring-2 focus:ring-orange-200">
                        <option value="{{driver.status }}"> {{driver.status}} </option>
                        <option value='active'>Active</option>
                        <option value='inactive'> Inactive </option>
                        <option value='deactivated'>Deactivated</option>
                    </select>
                </div>
                <div>
                    <label for="d_licence" class="mb-1.5 block text-sm font-semibold text-slate-800">Licence number</label>
                    <input type="text" name="licence_number" value="{{driver.licence_number }}" id="d_licence" required class="block w-full rounded-lg border border-slate-300 bg-slate-50 p-3 text-sm focus:border-orange-500 focus:outline-none focus:ring-2 focus:ring-orange-200">
                </div>
                <div class="grid gap-4 sm:grid-cols-2">
                    <div>
                        <label for="d_vehicle" class="mb-1.5 block text-sm font-semibold text-slate-800">Vehicle</label>
                        <select name="vehicle" id="d_vehicle" class="block w-full rounded-lg border border-slate-300 bg-slate-50 p-3 text-sm focus:border-orange-500 focus:outline-none focus:ring-2 focus:ring-orange-200">
                            <option value="{{driver.vehicle }}"> {{driver.vehicle}} </option>
                            <option value='pickup'>Pickup</option>
                            <option value='mini truck'>Mini truck</option>
                            <option value='box van'>Box van</option>
                            <option value='large truck'>Large truck</option>
                        </select>
                    </div>
                    <div><label for="d_plate" class="mb-1.5 block text-sm font-semibold text-slate-800">Plate number</label>
                        <input type="text" name="plate_number" value="{{driver.plate_number }}" id="d_plate" required class="block w-full rounded-lg border border-slate-300 bg-slate-50 p-3 text-sm focus:border-orange-500 focus:outline-none focus:ring-2 focus:ring-orange-200">
                    </div>
                </div>
                <button type="submit" class="w-full rounded-lg bg-orange-500 px-6 py-3 font-semibold text-white transition hover:bg-orange-600 focus:outline-none focus:ring-4 focus:ring-orange-200">Add driver</button>
            </form>
        </div>
        <div></div>
    </div>


{% endblock %}

{%block jsscript%}
<script src="{{ url_for('static', filename='js/script.js' ) }}">  </script>
{%endblock%}
